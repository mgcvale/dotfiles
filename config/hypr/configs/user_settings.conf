source = $HOME/.cache/wal/colors_hyprland
layerrule = match:namespace waybar, blur true
blurls = rofi,kitty,waybar

dwindle {
    preserve_split = yes
    special_scale_factor = 0.8
}

master {
    new_on_top = 1
}

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    col.active_border = rgba(cccccc44)
    col.inactive_border = rgba(99999911)
    layout = dwindle
}

group {
    col.border_active = $color2
    groupbar {
        col.active = $color2
    }
}

decoration {
    rounding = 0
    active_opacity = 1.5
    inactive_opacity = 1.5
    fullscreen_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.08
    shadow {
        enabled = true
        range = 84
        render_power = 18
        color = 0x2d000000
        color_inactive = 0x1e000000
        offset = -4 6
    }
    blur {
        enabled = true
        size = 5
        passes = 2
        ignore_opacity = true
        new_optimizations = true
    }
}

animations {
    enabled = no
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = slow, 0, 0.85, 0.3, 1
    bezier = bounce, 1.1, 1.6, 0.1, 0.85
    bezier = quick, 0, 0.84, 0.44, 1.04
    animation = windowsIn, 1, 7, slow, popin
    animation = windowsOut, 1, 7, winOut, popin
    animation = windowsMove, 1, 7, wind, slide
    animation = border, 1, 10, linear
    animation = fade, 1, 3.5, quick
    animation = workspaces, 1, 7, wind
    animation = windows, 1, 5, bounce, popin
}

input {
    kb_layout = br
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    repeat_rate = 50
    repeat_delay = 300
    numlock_by_default = 1
    left_handed = 0
    follow_mouse = 1
    float_switch_override_focus = 0
    sensitivity = 0
    touchpad {
        disable_while_typing = 0
        natural_scroll = 0
        clickfinger_behavior = 0
        middle_button_emulation = 0
        tap-to-click = 1
        drag_lock = 0
    }
}

gesture = 3, horizontal, workspace
gesture = 3, up, fullscreen
gesture = 3, down, float

misc {
    disable_hyprland_logo = false
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    enable_swallow = true
    focus_on_activate = false
    swallow_regex = ^(kitty)$
}

binds {
    workspace_back_and_forth = 1
    allow_workspace_cycles = 1
    pass_mouse_when_bound = 0
}

xwayland {
    force_zero_scaling = true
}
