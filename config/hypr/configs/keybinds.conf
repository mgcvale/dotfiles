bind = CTRL ALT, Delete, exec, hyprctl dispatch exit 0
bind = $main_mod, C, killactive,
bind = $main_mod, F, fullscreen
bind = $main_mod, Q, exec, kitty
bind = $main_mod SHIFT, Q, closewindow,
bind = $main_mod SHIFT, F, togglefloating,
bind = $main_mod ALT, F, exec, hyprctl dispatch workspaceopt allfloat
bind = CTRL ALT, L, exec, $scripts_dir/lock_screen.sh

bind = $main_mod ALT, R, exec, $scripts_dir/refresh.sh # Refresh waybar, swaync, rofi
bind = $main_mod SHIFT, B, exec, $scripts_dir/change_blur.sh # Toggle blur settings
bind = $main_mod SHIFT, V, exec, $scripts_dir/clip_manager.sh # Clipboard Manager
bind = $main_mod SHIFT, N, exec, swaync-client -t -sw # swayNC panel
bind = $main_mod SHIFT, C, exec, $scripts_dir/change_inactive_transparency.sh # Change transparency
bind = $main_mod, R, exec, $scripts_dir/change_refresh_rate.sh
bind = $main_mod, S, exec, $scripts_dir/change_sensitivity.sh

bind = $main_mod, W, exec, $scripts_dir/wallpaper_select.sh # Select wallpaper to apply

bind = $main_mod, B, exec, killall -SIGUSR1 waybar # Toggle hide/show waybar
bind = $main_mod CTRL, B, exec, $scripts_dir/waybar_styles.sh # Waybar Styles Menu
bind = $main_mod ALT, B, exec, $scripts_dir/waybar_layout.sh # Waybar Layout Menu

bind = CAPSLOCK,f,exec,rofi -show drun

bind = $main_mod CTRL, D, layoutmsg, removemaster
bind = $main_mod, I, layoutmsg, addmaster
bind = $main_mod, J, layoutmsg, cyclenext
bind = $main_mod, K, layoutmsg, cycleprev
bind = $main_mod, M, exec, hyprctl dispatch splitratio 0.3
bind = $main_mod, P, pseudo, # dwindle
bind = $main_mod CTRL, Return, layoutmsg, swapwithmaster
bind = $main_mod, L, exec, hyprctl dispatch exit
bind = $main_mod, G, togglegroup
bind = ALT, tab, changegroupactive  #change focus to another window

bind = , xf86audioraisevolume, exec, $scripts_dir/volume.sh --inc #volume up
bind = , xf86audiolowervolume, exec, $scripts_dir/volume.sh --dec #volume down
bind = SHIFT, xf86audiolowervolume, exec, $scripts_dir/volume.sh --dec-small
bind = SHIFT, xf86audioraisevolume, exec, $scripts_dir/volume.sh --inc-small
bind = , xf86AudioMicMute, exec, $scripts_dir/volume.sh --toggle-mic #mute mic
bind = , xf86audiomute, exec, $scripts_dir/volume.sh --toggle
bind = , xf86Sleep, exec, systemctl suspend  # sleep button

bind = $main_mod, Print, exec, $scripts_dir/screen_shot.sh --now
bind = $main_mod SHIFT, Print, exec, $scripts_dir/screen_shot.sh --area
bind = $main_mod CTRL, Print, exec, $scripts_dir/screen_shot.sh --in5 #screenshot in 5 secs
bind = $main_mod ALT, Print, exec, $scripts_dir/screen_shot.sh --in10 #screenshot in 10 secs
bind = ALT, Print, exec, $scripts_dir/screen_shot.sh --active #screenshot in 10 secs

bind = $main_mod SHIFT, S, exec, $scripts_dir/screen_shot.sh --swappy

binde = $main_mod SHIFT, left, resizeactive,-50 0
binde = $main_mod SHIFT, right, resizeactive,50 0
binde = $main_mod SHIFT, up, resizeactive,0 -50
binde = $main_mod SHIFT, down, resizeactive,0 50

bind = $main_mod CTRL, left, movewindow, l
bind = $main_mod CTRL, right, movewindow, r
bind = $main_mod CTRL, up, movewindow, u
bind = $main_mod CTRL, down, movewindow, d

bind = $main_mod, left, movefocus, l
bind = $main_mod, right, movefocus, r
bind = $main_mod, up, movefocus, u
bind = $main_mod, down, movefocus, d

