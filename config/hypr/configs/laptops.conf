bind = , xf86KbdBrightnessDown, exec, $scripts_dir/brightness_kbd.sh --dec #Keyboard brightness Down
bind = , xf86KbdBrightnessUp, exec, $scripts_dir/brightness_kbd.sh --inc #Keyboard brightness up
bind = , xf86MonBrightnessDown, exec, $scripts_dir/brightness.sh --dec
bind = , xf86MonBrightnessUp, exec, $scripts_dir/brightness.sh --inc
bind = SHIFT, xf86MonBrightnessUp, exec, $scripts_dir/brightness_less.sh --inc
bind = SHIFT, xf86MonBrightnessDown, exec, $scripts_dir/brightness_less.sh --dec

bind = $main_mod, F6, exec, $scripts_dir/screen_shot.sh --now # Fullscreen
bind = $main_mod SHIFT, F6, exec, $scripts_dir/screen_shot.sh --area
bind = $main_mod CTRL, F6, exec, $scripts_dir/screen_shot.sh --in5 # Screenshot in 5 secs
bind = $main_mod ALT, F6, exec, $scripts_dir/screen_shot.sh --in10 # Screenshot in 10 secs
bind = ALT, F6, exec, $scripts_dir/screen_shot.sh --active # Screenshot active window
